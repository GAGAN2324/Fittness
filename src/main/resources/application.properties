spring.application.name=microfit

# --- Database ---
# Override these via environment variables in production (e.g. on Railway):
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/microfit}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- JWT ---
# IMPORTANT: override JWT_SECRET in any real deployment. The default below is
# only here so the app runs out of the box in local dev.
jwt.secret=${JWT_SECRET:MicroFitSecretKeyMicroFitSecretKey123456}
# Token lifetime in milliseconds (default: 24 hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
